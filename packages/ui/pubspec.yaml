name: wasa_ui
description: WASA Bhakkar theme, strings and shared widgets.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  wasa_core:
    path: ../core
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/brand/
  fonts:
    - family: NotoNaskhArabic
      fonts:
        - asset: fonts/NotoNaskhArabic-Regular.ttf
        - asset: fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
